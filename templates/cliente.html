<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Área del cliente - Pepinos Locos</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='estilo.css') }}"
    >

</head>


<body>


    <!-- BARRA DE NAVEGACIÓN -->

    <header class="barra">

        <div class="logo">
            PEPINOS LOCOS
        </div>


        <nav>

            <a href="{{ url_for('inicio') }}">
                Inicio
            </a>

            <a href="{{ url_for('menu_cliente') }}">
                Productos
            </a>

            <a href="{{ url_for('consulta') }}">
                Consultar pedido
            </a>

            <a href="{{ url_for('login') }}">
                Dueño
            </a>

        </nav>

    </header>



    <!-- ÁREA DEL CLIENTE -->

    <main class="contenido-pagina">

        <div class="tarjeta-formulario">

            <p class="pequeno">
                ÁREA DEL CLIENTE
            </p>


            <h1>
                Haz tu pedido
            </h1>


            <p class="texto-formulario">

                Ingresa tus datos para realizar
                tu pedido y recibir tu factura.

            </p>


            <form
                action="{{ url_for('menu') }}"
                method="POST"
            >


                <label for="nombre">
                    Tu nombre
                </label>


                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Escribe tu nombre"
                    required
                >


                <label for="telefono">
                    Número de WhatsApp
                </label>


                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Ejemplo: 70000000"
                    maxlength="8"
                    pattern="[0-9]{8}"
                    required
                >


                <small>
                    Escribe solamente los 8 números de tu teléfono.
                </small>


                <button type="submit">
                    Continuar
                </button>

            </form>


            <a
                href="{{ url_for('inicio') }}"
                class="boton-secundario"
            >
                Volver al inicio
            </a>

        </div>

    </main>



    <!-- PIE DE PÁGINA -->

    <footer>

        <h3>
            PEPINOS LOCOS
        </h3>

        <p>
            Gracias por elegirnos.
        </p>

        <p class="copyright">
            © 2026 Pepinos Locos
        </p>

    </footer>


</body>

</html>
