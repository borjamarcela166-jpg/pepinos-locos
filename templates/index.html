<form action="{{ url_for('pedido') }}" method="POST">

    <input
        type="hidden"
        name="nombre"
        value="{{ nombre }}"
    >

    <input
        type="hidden"
        name="telefono"
        value="{{ telefono }}"
    >

    <!-- aquí van los productos -->

    <button type="submit">
        Realizar pedido
    </button>

</form>
