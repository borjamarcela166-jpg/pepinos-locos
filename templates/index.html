<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Productos - Pepinos Locos</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='estilo.css') }}"
    >

</head>

<body>

<header class="barra">

    <div class="logo">
        PEPINOS LOCOS
    </div>

    <nav>

        <a href="{{ url_for('inicio') }}">
            Inicio
        </a>

        <a href="{{ url_for('menu_cliente') }}">
            Productos
        </a>

        <a href="{{ url_for('consulta') }}">
            Consultar pedido
        </a>

        <a href="{{ url_for('login') }}">
            Dueño
        </a>

    </nav>

</header>


<main class="contenido-pagina">

    <div class="tarjeta-formulario">

        <p class="pequeno">
            MENÚ DE PRODUCTOS
        </p>

        <h1>
            Elige tu Pepino Loco
        </h1>

        <p class="texto-formulario">

            Hola,
            <strong>{{ nombre }}</strong>.

            Elige tu producto y la cantidad.

        </p>


        {% if error %}

        <p style="color: red; font-weight: bold;">
            {{ error }}
        </p>

        {% endif %}


        <form
            action="{{ url_for('pedido') }}"
            method="POST"
        >

            <!-- DATOS DEL CLIENTE -->

            <input
                type="hidden"
                name="nombre"
                value="{{ nombre }}"
            >

            <input
                type="hidden"
                name="telefono"
                value="{{ telefono }}"
            >


            <!-- PRODUCTO 1 -->

            <div class="producto">

                <label>

                    <input
                        type="radio"
                        name="producto"
                        value="Pepino Loco"
                        required
                    >

                    <strong>
                        Pepino Loco
                    </strong>

                </label>

                <p>
                    Precio: $0.50
                </p>

                <img
                    src="{{ url_for('static', filename='pepino-loco.jpg') }}"
                    alt="Pepino Loco"
                >

            </div>


            <!-- PRODUCTO 2 -->

            <div class="producto">

                <label>

                    <input
                        type="radio"
                        name="producto"
                        value="Pepino Loco con Gomitas"
                    >

                    <strong>
                        Pepino Loco con Gomitas
                    </strong>

                </label>

                <p>
                    Precio: $0.75
                </p>

                <img
                    src="{{ url_for('static', filename='descargar (3).jpg') }}"
                    alt="Pepino Loco con Gomitas"
                >

            </div>


            <!-- CANTIDAD -->

            <label for="cantidad">
                Cantidad
            </label>

            <input
                type="number"
                id="cantidad"
                name="cantidad"
                min="1"
                value="1"
                required
            >


            <!-- BOTÓN -->

            <button type="submit">
                Realizar pedido
            </button>

        </form>


        <a
            href="{{ url_for('menu_cliente') }}"
            class="boton-secundario"
        >
            Volver
        </a>

    </div>

</main>


<footer>

    <h3>
        PEPINOS LOCOS
    </h3>

    <p>
        Gracias por elegirnos.
    </p>

    <p class="copyright">
        © 2026 Pepinos Locos
    </p>

</footer>

</body>

</html>
