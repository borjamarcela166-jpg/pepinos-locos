<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Pepinos Locos</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body>

    <h1>PEPINOS LOCOS</h1>

    <h2>Hola {{ nombre }}</h2>

    <h2>Haz tu pedido</h2>

    <form action="{{ url_for('pedido') }}" method="POST">

        <input type="hidden" name="nombre" value="{{ nombre }}">

        <div class="productos">

            <div class="producto">

                <img src="{{ url_for('static', filename='descargar (3).jpg') }}">

                <h3>1. Pepino Loco</h3>

                <p>$0.50</p>

                <input
                    type="radio"
                    name="producto"
                    value="Pepino Loco"
                    required
                >

                Elegir

            </div>

            <div class="producto">

                <img src="{{ url_for('static', filename='pepino-loco.jpg') }}">

                <h3>2. Pepino Loco con Gomitas</h3>

                <p>$0.75</p>

                <input
                    type="radio"
                    name="producto"
                    value="Pepino Loco con Gomitas"
                >

                Elegir

            </div>

        </div>

        <br>

        <label>Cantidad:</label>

        <input
            type="number"
            name="cantidad"
            min="1"
            value="1"
            required
        >

        <br><br>

        <button type="submit">
            Hacer pedido
        </button>

    </form>

</body>

</html>
