<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Estado del pedido</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>

<body>

    <h1>Estado de tu pedido</h1>

    <div class="producto">

        <h2>Pedido #{{ pedido.numero }}</h2>

        <p>
            <b>Nombre:</b>
            {{ pedido.nombre }}
        </p>

        <p>
            <b>Producto:</b>
            {{ pedido.producto }}
        </p>

        <p>
            <b>Cantidad:</b>
            {{ pedido.cantidad }}
        </p>

        <p>
            <b>Total:</b>
            ${{ pedido.total }}
        </p>

        {% if pedido.confirmado == 1 %}

            <p>
                Pedido confirmado.
            </p>

            <a href="{{ url_for('factura', numero=pedido.numero, origen='cliente') }}">
                <button type="button">
                    Ver factura
                </button>
            </a>

        {% else %}

            <p>
                Tu pedido está pendiente de confirmación.
            </p>

        {% endif %}

        <br><br>

        <a href="{{ url_for('consulta') }}">
            <button type="button">
                Consultar otro pedido
            </button>
        </a>

        <a href="{{ url_for('inicio') }}">
            <button type="button">
                Volver al inicio
            </button>
        </a>

    </div>

</body>

</html>
