<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido realizado</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
    <h1>Pedido realizado</h1>
    <div class="producto">
        <h2>Gracias por tu compra, {{ pedido.nombre }}</h2>
        <p><b>Número de pedido:</b> #{{ pedido.numero }}</p>
        <p><b>Producto:</b> {{ pedido.producto }}</p>
        <p><b>Cantidad:</b> {{ pedido.cantidad }}</p>
        <p><b>Total:</b> ${{ pedido.total }}</p>
        <p>Tu pedido está pendiente de confirmación.</p>
        <a href="{{ url_for('consulta') }}">
            <button> Consultar mi pedido</button>
        </a>
    </div>
</body>
</html>
